<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ex Libris Nufla — a catalogue of Nufla's book collection: cover shelf, spines, filters, reading progress and reading stats.">
<meta name="theme-color" content="#121020" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EFEDF4" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235B2BD6'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-style='italic' font-weight='700' font-size='21' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#faf9f7}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Ex Libris Nufla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..700&family=Karla:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+Sinhala:wght@400..700&display=swap">

<style>
/* ============================================================
   THE SPINE INDEX — a personal library
   Palette: shelf-dark ground, foil-bright genre spines.
   Categorical genre hues validated for CVD in both themes.
   ============================================================ */

:root{
  /* --- surfaces & ink (light: the shelf with the lamp on) --- */
  --ground:#EFEDF4;
  --ground-2:#E3E0EC;
  --surface:#FFFFFF;
  --surface-2:#F7F6FB;
  --surface-3:#EEEBF5;
  --ink:#191627;
  --ink-2:#4C4664;
  --ink-3:#7B7494;
  --line:#DEDAEA;
  --line-2:#C9C3DC;

  --accent:#5B2BD6;
  --accent-2:#B01E6A;
  --accent-soft:#EBE3FD;
  --gold:#8A6A12;
  --gold-soft:#F4E9CB;

  --good:#0F7A55;
  --warn:#9A6B08;
  --crit:#B42B3F;

  /* --- categorical genre hues (validated, light) --- */
  --c1:#5B2BD6;  /* Crime & Thriller */
  --c2:#B8770A;  /* Romance          */
  --c3:#00897B;  /* Fantasy          */
  --c4:#DB4B2A;  /* Mystery          */
  --c5:#1F52C4;  /* Sinhala          */
  --c6:#6E8C0E;  /* Children's       */
  --c7:#B01E6A;  /* Young Adult      */
  --c8:#0E86B8;  /* Non-fiction      */
  --c9:#6B6580;  /* Other            */

  --shelf:#2A2438;
  --shelf-board:#CFC8DC;

  --r-s:6px; --r-m:10px; --r-l:16px; --r-xl:24px;
  --sh-1:0 1px 2px rgba(25,22,39,.07), 0 4px 14px -8px rgba(25,22,39,.18);
  --sh-2:0 2px 6px rgba(25,22,39,.09), 0 18px 40px -20px rgba(25,22,39,.34);
  --sh-3:0 30px 70px -28px rgba(25,22,39,.48);
  --spine-tint:rgba(255,255,255,.0);

  --f-display:"Bodoni Moda","Noto Sans Sinhala",Georgia,"Times New Roman",serif;
  --f-body:"Karla","Noto Sans Sinhala",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --ease:cubic-bezier(.22,.68,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121020;
    --ground-2:#0B0914;
    --surface:#1B1830;
    --surface-2:#221E3B;
    --surface-3:#2A2547;
    --ink:#F1EEFA;
    --ink-2:#BDB6D6;
    --ink-3:#8C84A8;
    --line:#2E294A;
    --line-2:#403A63;

    --accent:#A58BFF;
    --accent-2:#E35C9C;
    --accent-soft:#2A2450;
    --gold:#D8B45E;
    --gold-soft:#3A3018;

    --good:#3DBF8E;
    --warn:#D8A63C;
    --crit:#F0708A;

    --c1:#8B6CF0; --c2:#BE8628; --c3:#2AA891; --c4:#E26648;
    --c5:#5183F0; --c6:#7CA123; --c7:#E35C9C; --c8:#2B99C2; --c9:#8B849E;

    --shelf:#080611;
    --shelf-board:#221E38;

    --sh-1:0 1px 2px rgba(0,0,0,.5), 0 4px 14px -8px rgba(0,0,0,.7);
    --sh-2:0 2px 8px rgba(0,0,0,.5), 0 18px 44px -20px rgba(0,0,0,.9);
    --sh-3:0 30px 70px -28px rgba(0,0,0,.95);
    --spine-tint:rgba(255,255,255,.05);
  }
}

:root[data-theme="dark"]{
  --ground:#121020;
  --ground-2:#0B0914;
  --surface:#1B1830;
  --surface-2:#221E3B;
  --surface-3:#2A2547;
  --ink:#F1EEFA;
  --ink-2:#BDB6D6;
  --ink-3:#8C84A8;
  --line:#2E294A;
  --line-2:#403A63;

  --accent:#A58BFF;
  --accent-2:#E35C9C;
  --accent-soft:#2A2450;
  --gold:#D8B45E;
  --gold-soft:#3A3018;

  --good:#3DBF8E;
  --warn:#D8A63C;
  --crit:#F0708A;

  --c1:#8B6CF0; --c2:#BE8628; --c3:#2AA891; --c4:#E26648;
  --c5:#5183F0; --c6:#7CA123; --c7:#E35C9C; --c8:#2B99C2; --c9:#8B849E;

  --shelf:#080611;
  --shelf-board:#221E38;

  --sh-1:0 1px 2px rgba(0,0,0,.5), 0 4px 14px -8px rgba(0,0,0,.7);
  --sh-2:0 2px 8px rgba(0,0,0,.5), 0 18px 44px -20px rgba(0,0,0,.9);
  --sh-3:0 30px 70px -28px rgba(0,0,0,.95);
  --spine-tint:rgba(255,255,255,.05);
}

/* ---------------- base ---------------- */
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed; inset:-20% -10% auto -10%; height:70vh;
  background:
    radial-gradient(48% 60% at 14% 0%, color-mix(in srgb, var(--c1) 26%, transparent), transparent 70%),
    radial-gradient(42% 55% at 82% 8%, color-mix(in srgb, var(--c7) 22%, transparent), transparent 72%),
    radial-gradient(40% 50% at 50% 0%, color-mix(in srgb, var(--c8) 16%, transparent), transparent 75%);
  filter:blur(26px);
  opacity:.5;
  pointer-events:none;
  z-index:0;
  animation:drift 38s var(--ease) infinite alternate;
}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(2%,1.5%,0) scale(1.06)}
  100%{transform:translate3d(-2%,-1%,0) scale(1.02)}
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft);color:var(--ink)}

.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding-inline:20px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------------- header ---------------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:60;
  background:color-mix(in srgb, var(--ground) 84%, transparent);
  backdrop-filter:saturate(1.5) blur(14px);
  -webkit-backdrop-filter:saturate(1.5) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1400px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{
  width:30px;height:34px;border-radius:3px 6px 6px 3px;flex-shrink:0;
  background:linear-gradient(135deg,var(--c1),var(--c7) 55%,var(--c4));
  border-left:4px solid color-mix(in srgb, var(--ink) 55%, var(--c1));
  box-shadow:var(--sh-1);
  position:relative;overflow:hidden;
}
.brand-mark::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 47%,transparent 62%);
  transform:translateX(-130%);
  animation:foil 5.5s var(--ease) 1.1s infinite;
}
@keyframes foil{0%{transform:translateX(-130%)}22%,100%{transform:translateX(130%)}}
.brand-mark span{
  position:relative;z-index:1;
  font-family:var(--f-display);font-weight:700;font-size:18px;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.35);padding-left:3px;
}
.brand-mark{display:grid;place-items:center}
.brand-name{display:flex;flex-direction:column;line-height:1;white-space:nowrap;gap:3px}
.bn-1{
  font-family:var(--f-mono);font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink-3);
}
.bn-2{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:19px}

/* ---------------- bookplate ---------------- */
.plate{padding:28px 0 4px}
.plate-card{
  position:relative;text-align:center;overflow:hidden;
  border:1px solid var(--line-2);border-radius:var(--r-l);
  padding:clamp(26px,4.4vw,42px) clamp(26px,5vw,58px);
  background:
    radial-gradient(130% 150% at 50% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 64%),
    var(--surface);
  box-shadow:var(--sh-1);
  animation:plateIn .72s var(--ease-out) both;
}
@keyframes plateIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.plate-card::before{
  content:"";position:absolute;inset:7px;pointer-events:none;
  border:1px solid var(--line);border-radius:calc(var(--r-l) - 5px);
}
.orn{position:absolute;width:34px;height:34px;color:var(--gold);opacity:.65;pointer-events:none}
.o-tl{top:9px;left:9px}
.o-tr{top:9px;right:9px;transform:scaleX(-1)}
.o-bl{bottom:9px;left:9px;transform:scaleY(-1)}
.o-br{bottom:9px;right:9px;transform:scale(-1,-1)}
@media (max-width:420px){ .orn{display:none} }

.plate-ex{
  font-family:var(--f-mono);font-size:clamp(9.5px,2vw,11.5px);
  letter-spacing:.44em;text-indent:.44em;text-transform:uppercase;color:var(--ink-3);
}
.plate-name{
  font-family:var(--f-display);font-style:italic;font-weight:500;
  font-size:clamp(46px,10.5vw,88px);line-height:1.02;margin:4px 0 0;
  letter-spacing:-.01em;color:var(--ink);
}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .plate-name{
    background-image:linear-gradient(100deg,var(--ink) 34%,var(--gold) 50%,var(--ink) 66%);
    background-size:260% 100%;background-position:160% 0;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    animation:sheen 7s var(--ease) 1.3s infinite;
  }
}
@keyframes sheen{0%{background-position:160% 0}30%,100%{background-position:-60% 0}}

.plate-rule{
  height:1px;width:0;margin:16px auto 14px;
  background:linear-gradient(90deg,transparent,var(--line-2) 16%,var(--gold) 50%,var(--line-2) 84%,transparent);
  animation:drawRule 1.05s var(--ease-out) .4s both;
}
@keyframes drawRule{from{width:0}to{width:min(260px,72%)}}

.plate-ded{
  display:block;margin:0 auto;max-width:46ch;
  font-family:var(--f-display);font-style:italic;font-size:clamp(15px,2.3vw,19px);
  line-height:1.5;color:var(--ink-2);text-align:center;text-wrap:balance;
  border-bottom:1px dashed transparent;transition:color .18s,border-color .18s;
}
.plate-ded:hover,.plate-ded:focus-visible{color:var(--ink);border-bottom-color:var(--line-2)}
.plate-meta{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin-top:18px;
}
.greet{margin:16px 2px 0;color:var(--ink-2);font-size:15px}

.search{
  position:relative;flex:1 1 220px;min-width:0;
}
.search input{
  width:100%;padding:9px 34px 9px 34px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  transition:border-color .18s,box-shadow .18s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.search input::placeholder{color:var(--ink-3)}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;display:flex}
.search-kbd{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font-family:var(--f-mono);font-size:11px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface-2);
}
.search input:not(:placeholder-shown) ~ .search-kbd{display:none}

.tools{display:flex;align-items:center;gap:8px;flex-shrink:0}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;
  transition:transform .16s var(--ease), box-shadow .16s, background .16s, border-color .16s;
  white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-1);border-color:var(--line-2)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%, var(--accent-2)));
  color:#fff;border-color:transparent;box-shadow:var(--sh-1);
}
:root[data-theme="dark"] .btn-primary,
:root:not([data-theme="light"]) .btn-primary{color:#140F26}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn-primary{color:#fff}}
.btn-primary:hover{box-shadow:var(--sh-2)}
.btn-icon{padding:8px;width:36px;height:36px;justify-content:center;border-radius:50%}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn-danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%, var(--line))}
.btn-sm{padding:5px 11px;font-size:13px}

/* ---------------- view tabs ---------------- */
.views{
  display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:3px;flex-shrink:0;
}
.views button{
  padding:6px 13px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-3);
  display:inline-flex;align-items:center;gap:6px;transition:color .16s,background .2s var(--ease);
}
.views button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.views button:hover{color:var(--ink)}
.views .vt-label{display:inline}
@media (max-width:860px){ .views .vt-label{display:none} .views button{padding:7px 11px} }

/* ---------------- stat strip ---------------- */
.strip{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r-l);
  overflow:hidden;margin:18px 0 22px;
}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat .k{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);
}
.stat .v{font-family:var(--f-display);font-size:27px;font-weight:700;line-height:1.1}
.stat .sub{font-size:12.5px;color:var(--ink-3)}
.stat.goal{gap:7px}

.ring{--p:0;width:44px;height:44px;flex-shrink:0}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset 1.1s var(--ease-out)}

/* ---------------- layout ---------------- */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px;align-items:start;padding-bottom:70px}
.layout.no-rail{grid-template-columns:minmax(0,1fr)}
@media (max-width:980px){ .layout{grid-template-columns:1fr;gap:16px} }

.rail{
  position:sticky;top:calc(env(safe-area-inset-top, 0px) + 68px);
  display:flex;flex-direction:column;gap:18px;
  max-height:calc(100vh - 100px);overflow-y:auto;padding-right:4px;padding-bottom:10px;
}
.rail::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px}
@media (max-width:980px){
  .rail{position:static;max-height:none;overflow:visible;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px}
  .rail[hidden]{display:none!important}
}
.rail-toggle{display:none}
@media (max-width:980px){ .rail-toggle{display:inline-flex} }

.fgroup h3{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 9px;font-weight:500;
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:13px;color:var(--ink-2);font-weight:500;
  transition:transform .14s var(--ease),border-color .16s,background .16s,color .16s;
}
.chip:hover{transform:translateY(-1px);border-color:var(--line-2);color:var(--ink)}
.chip[aria-pressed="true"]{
  background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  color:var(--ink);font-weight:600;
}
.chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--c9)}
.chip .ct{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.chip[aria-pressed="true"] .ct{color:var(--ink-2)}

.field{display:flex;flex-direction:column;gap:5px}
.field label{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
}
select,input[type="text"],input[type="number"],input[type="date"],input[type="url"],textarea{
  padding:8px 10px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);width:100%;
  transition:border-color .16s, box-shadow .16s;
}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
textarea{resize:vertical;min-height:70px;line-height:1.55}

/* ---------------- toolbar above results ---------------- */
.resbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:14px;
}
.count{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3);letter-spacing:.02em}
.count b{color:var(--ink);font-weight:700}
.resbar .spacer{flex:1}
.sortsel{display:flex;align-items:center;gap:6px}
.sortsel select{width:auto;padding:6px 26px 6px 10px;font-size:13px}

.activefilters{display:flex;gap:6px;flex-wrap:wrap}
.afil{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
  padding:4px 6px 4px 10px;border-radius:999px;
  background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
}
.afil button{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;
  color:var(--ink-2);font-size:14px;line-height:1}
.afil button:hover{background:color-mix(in srgb,var(--ink) 12%,transparent)}

/* ---------------- shelf (cover grid) ---------------- */
.grid{
  display:grid;gap:22px 18px;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
}
@media (max-width:520px){ .grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:18px 14px} }

.card{
  display:flex;flex-direction:column;gap:9px;text-align:left;width:100%;
  animation:riseIn .5s var(--ease-out) both;
}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.cover{
  position:relative;aspect-ratio:2/3;max-width:100%;border-radius:3px 7px 7px 3px;
  overflow:hidden;box-shadow:var(--sh-1);
  background:linear-gradient(150deg,var(--g,var(--c9)),color-mix(in srgb,var(--g,var(--c9)) 62%, #000) 100%);
  transition:transform .35s var(--ease-out), box-shadow .35s var(--ease-out);
  transform-style:preserve-3d;
}

var LS_BOOKS = "spineindex.books.v1";

function lsGet(k, fb){
  try{ var r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; }catch(e){ return fb; }
}
function lsSet(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
}

function uid(){
  return "b" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function persistLocal(){
  lsSet(LS_BOOKS, state.books.map(function(b){
    var o = {}; FIELDS.forEach(function(f){ if(b[f] !== undefined && b[f] !== "" && b[f] !== 0 && b[f] !== false) o[f] = b[f]; });
    o.id = b.id; o.status = b.status; o.genre = b.genre;
    return o;
  }));
}

function saveBook(book){
  var i = state.books.findIndex(function(b){ return b.id === book.id; });
  if(i >= 0) state.books[i] = book; else state.books.push(book);
  persistLocal();
  render();
}

function removeBook(id){
  state.books = state.books.filter(function(b){ return b.id !== id; });
  delete state.selection[id];
  persistLocal();
  render();
}

function savePrefs(){
  lsSet(LS_PREFS, {goal: state.goal, seedVersion: SEED_VERSION});
}

function saveGoal(n){

  savePrefs();
  render();
}

/* When the published catalogue gains facts a browser's saved copy predates
   — jackets, spine colours, years, page counts — fold them in without
   touching anything she has changed herself. */
function migrateSeed(books){
  var byId = {};
  books.forEach(function(b){ byId[b.id] = b; });
  var touched = 0;
  SEED.forEach(function(r, i){
    var b = byId["b" + (i + 1)];
    if(!b || b.title !== r[0]) return;      // renamed or replaced — leave it alone
    if(!b.cover && r[8]){ b.cover = r[8]; touched++; }
    if(!b.color && r[9]){ b.color = r[9]; touched++; }
    if(!b.year  && r[10]){ b.year  = r[10]; touched++; }
    if(!b.pages && r[11]){ b.pages = r[11]; touched++; }
  });
  return touched;
}

/* Corrections to facts I got wrong the first time. Applied only where the
   saved value is still the wrong one, so anything she has since edited or
   confirmed herself is never overwritten. */
function applyFixes(books){
  var byId = {};
  books.forEach(function(b){ byId[b.id] = b; });
  var touched = 0;
  FIXES.forEach(function(f){
    var b = byId[f[0]], field = f[1], was = f[2], now = f[3];
    if(!b) return;
    if(field === "tags"){
      if((b.tags || []).join("|") !== was) return;
      b.tags = now ? now.split("|") : [];
    } else {
      if(b[field] !== was) return;
      b[field] = now;
    }
    touched++;
  });
  return touched;
}

function seedBooks(){
  return SEED.map(function(r, i){
    return normalize({
      id: "b" + String(i+1),
      title: r[0], author: r[1], genre: r[2], shelf: r[3],
      series: r[4], seriesNo: r[5],
      tags: r[6] ? r[6].split("|") : [],
      language: r[7], format: "Paperback", status: "toread",
      cover: r[8] || "",          // jacket filename stem, from Open Library
      color: r[9] || "",          // spine colour read off that jacket
      year: r[10] || 0,
      pages: r[11] || 0,
      dateAdded: "2026-09-19"
    });
  });
}

function resetToOriginal(){
  state.books = seedBooks();
  state.selection = {};
  persistLocal();
  render();
}

function bootStorage(){
  var prefs = lsGet(LS_PREFS, null);
  if(prefs && prefs.goal) state.goal = prefs.goal;
  var savedVersion = (prefs && prefs.seedVersion) || 1;

  var saved = lsGet(LS_BOOKS, null);
  if(saved && saved.length){
    state.books = saved.map(normalize);
    if(savedVersion < SEED_VERSION){
      var changed = migrateSeed(state.books) + applyFixes(state.books);
      if(changed) persistLocal();
    }
  } else {
    state.books = seedBooks();
    persistLocal();
  }
  if(savedVersion !== SEED_VERSION) savePrefs();

  state.loaded = true;
  render();
}

function normalize(b){
  b = Object.assign({}, b);
  if(!b.id) b.id = uid();
  b.title = b.title || "Untitled";
  b.author = b.author || "";
  b.genre = GMAP[b.genre] ? b.genre : "other";
  b.status = SMAP[b.status] ? b.status : "toread";
  b.tags = Array.isArray(b.tags) ? b.tags : (b.tags ? String(b.tags).split(",").map(trim).filter(Boolean) : []);
  b.rating = Number(b.rating) || 0;
  b.pages = Number(b.pages) || 0;
  b.currentPage = Number(b.currentPage) || 0;
  b.year = Number(b.year) || 0;
  b.seriesNo = b.seriesNo === "" || b.seriesNo === undefined ? "" : b.seriesNo;
  b.favorite = !!b.favorite;
  b.dateAdded = b.dateAdded || todayISO();
  return b;
}
function trim(s){ return String(s).trim(); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function genreColor(b){ return "var(" + (GMAP[b.genre] || GMAP.other).v + ")"; }
function bookColor(b){ return b.color ? b.color : genreColor(b); }

function progressOf(b){
  if(b.status === "read") return 1;
  if(!b.pages || !b.currentPage) return 0;
  return Math.max(0, Math.min(1, b.currentPage / b.pages));
}

function matchesQuery(b, q){
  if(!q) return true;
  var hay = [b.title, b.author, b.series, b.publisher, b.isbn, b.shelf, b.notes, b.quote, b.lentTo,
    (b.tags||[]).join(" "), (GMAP[b.genre]||{}).name].join(" ").toLowerCase();
  return q.split(/\s+/).every(function(tok){ return hay.indexOf(tok) >= 0; });
}

function activeFilterCount(){
  var n = 0;
  Object.keys(state.filters).forEach(function(k){ n += state.filters[k].length; });
  return n;
}

function visibleBooks(){
  var q = state.q.trim().toLowerCase();
  var f = state.filters;
  var out = state.books.filter(function(b){
    if(!matchesQuery(b, q)) return false;
    if(f.genre.length && f.genre.indexOf(b.genre) < 0) return false;
    if(f.status.length && f.status.indexOf(b.status) < 0) return false;
    if(f.format.length && f.format.indexOf(b.format || "") < 0) return false;
    if(f.language.length && f.language.indexOf(b.language || "") < 0) return false;
    if(f.shelf.length && f.shelf.indexOf(b.shelf || "") < 0) return false;
    if(f.tag.length && !f.tag.every(function(t){ return (b.tags||[]).indexOf(t) >= 0; })) return false;
    if(f.stars.length && f.stars.indexOf(String(b.rating)) < 0) return false;
    if(f.flag.indexOf("fav") >= 0 && !b.favorite) return false;
    if(f.flag.indexOf("lent") >= 0 && !b.lentTo) return false;
    if(f.flag.indexOf("unrated") >= 0 && b.rating) return false;
    if(f.flag.indexOf("series") >= 0 && !b.series) return false;
    if(f.flag.indexOf("needs") >= 0 && !isFlagged(b)) return false;
    return true;
  });
  return sortBooks(out, state.sort);
}

function sortBooks(list, key){
  var parts = key.split("-"), field = parts[0], dir = parts[1] === "desc" ? -1 : 1;
  var copy = list.slice();
  copy.sort(function(a,b){
    var x, y;
    switch(field){
      case "title":  x=(a.title||"").toLowerCase(); y=(b.title||"").toLowerCase(); break;
      case "author": x=surname(a.author); y=surname(b.author); break;
      case "rating": x=a.rating; y=b.rating; break;
      case "pages":  x=a.pages;  y=b.pages;  break;
      case "year":   x=a.year;   y=b.year;   break;
      case "prog":   x=progressOf(a); y=progressOf(b); break;
      case "series": x=((a.series||"~")+" "+pad(a.seriesNo)).toLowerCase(); y=((b.series||"~")+" "+pad(b.seriesNo)).toLowerCase(); break;
      default:       x=a.dateAdded||""; y=b.dateAdded||"";
    }
    if(x < y) return -1*dir;
    if(x > y) return 1*dir;
    return (a.title||"").localeCompare(b.title||"");
  });
  return copy;
}
function pad(n){ n = String(n||""); return n.length < 3 ? "00".slice(0, 3-n.length) + n : n; }
function surname(a){
  if(!a) return "zzz";
  var p = String(a).trim().split(/\s+/);
  return (p[p.length-1] + " " + p[0]).toLowerCase();
}

function facet(key, get){
  var m = {};
  state.books.forEach(function(b){
    var vals = get(b);
    if(!Array.isArray(vals)) vals = [vals];
    vals.forEach(function(v){ if(v !== undefined && v !== null && v !== "") m[v] = (m[v]||0)+1; });
  });
  return m;
}

function el(tag, attrs, kids){
  var n = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if(v === null || v === undefined || v === false) return;
    if(k === "class") n.className = v;
    else if(k === "text") n.textContent = v;
    else if(k === "html") n.innerHTML = v;
    else if(k === "style") n.setAttribute("style", v);
    else if(k.slice(0,2) === "on") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  });
  (kids || []).forEach(function(c){ if(c) n.appendChild(c); });
  return n;
}
function esc(s){ return String(s == null ? "" : s); }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }

function toast(msg, actionLabel, onAction){
  var host = document.getElementById("toasts");
  var t = el("div",{class:"toast"},[ el("span",{class:"tmsg",text:msg}) ]);
  if(actionLabel){
    t.appendChild(el("button",{text:actionLabel,onclick:function(){ onAction(); kill(); }}));
  }
  host.appendChild(t);
  var timer = setTimeout(kill, actionLabel ? 7000 : 3400);
  function kill(){
    clearTimeout(timer);
    if(!t.parentNode) return;
    t.classList.add("out");
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 250);
  }
  return kill;
}

var OWNER = "Nufla";

function greeting(){
  var h = new Date().getHours();
  if(h < 5)  return "Still reading, " + OWNER + "?";
  if(h < 12) return "Good morning, " + OWNER + ".";
  if(h < 17) return "Good afternoon, " + OWNER + ".";
  if(h < 21) return "Good evening, " + OWNER + ".";
  return "Good night, " + OWNER + ".";
}

function renderMast(){
  var p = document.getElementById("mastP");
  var meta = document.getElementById("plateMeta");
  var n = state.books.length;

  if(!n){
    p.textContent = greeting() + " Nothing catalogued yet — add a book, or import a CSV to fill the shelves in one go.";
    meta.textContent = "A library waiting to be filled";
    return;
  }

  var reading = state.books.filter(function(b){ return b.status==="reading"; });
  var authors = Object.keys(facet("a", function(b){ return b.author; })).length;

  meta.textContent = n + " volume" + (n===1?"":"s") + " · " + authors + " authors · "
    + Object.keys(facet("l", function(b){ return b.language; })).length + " languages";

  var bits = greeting() + " " + n + " book" + (n===1?"":"s") + " on the shelves, by " + authors + " authors";
  if(reading.length === 1) bits += " — and “" + reading[0].title + "” is open right now";
  else if(reading.length > 1) bits += " — with " + reading.length + " open at once";
  p.textContent = bits + ".";
}

function editDedication(){
  var cur = DEFAULT_DED;
  try{ cur = localStorage.getItem("spineindex.dedication") || DEFAULT_DED; }catch(e){}
  var next = prompt("A dedication for this library — leave it empty to restore the original.", cur);
  if(next === null) return;
  next = next.trim();
  try{
    if(next) localStorage.setItem("spineindex.dedication", next);
    else localStorage.removeItem("spineindex.dedication");

  renderDedication();

function renderStrip(){
  var host = document.getElementById("strip");
  clear(host);
  var bs = state.books;
  var read = bs.filter(function(b){ return b.status==="read"; });
  var rated = bs.filter(function(b){ return b.rating > 0; });
  var avg = rated.length ? (rated.reduce(function(s,b){ return s+b.rating; },0)/rated.length) : 0;
  var pages = read.reduce(function(s,b){ return s + (b.pages||0); }, 0);
  var year = new Date().getFullYear();
  var thisYear = read.filter(function(b){ return (b.dateFinished||"").slice(0,4) === String(year); }).length;
  var pct = state.goal ? Math.min(1, thisYear/state.goal) : 0;

  host.appendChild(stat("In the collection", String(bs.length), bs.filter(function(b){return b.favorite;}).length + " favourites"));
  host.appendChild(stat("Read", String(read.length), bs.length ? Math.round(read.length/bs.length*100) + "% of the shelf" : "—"));
  host.appendChild(stat("Unread", String(bs.filter(function(b){ return b.status==="toread"; }).length), "waiting their turn"));
  host.appendChild(stat("Average rating", avg ? avg.toFixed(1) : "—", rated.length + " rated"));
  host.appendChild(stat("Pages read", pages ? pages.toLocaleString() : "—", "from finished books"));

  var ringId = "goalRing";
  var goalCell = el("div",{class:"stat goal"},[
    el("div",{class:"k",text:year + " reading goal"}),
    el("div",{style:"display:flex;align-items:center;gap:11px"},[
      ringSVG(ringId, pct),
      el("div",{},[
        el("div",{class:"v num",style:"font-size:22px",text:thisYear + " / " + state.goal}),
        el("div",{class:"sub",text: thisYear >= state.goal ? "goal met — lovely" : (state.goal-thisYear) + " to go"})
      ])
    ])
  ]);
  goalCell.style.cursor = "pointer";
  goalCell.title = "Click to change your yearly goal";
  goalCell.addEventListener("click", function(){
    var v = prompt("How many books do you want to finish in " + year + "?", String(state.goal));
    if(v === null) return;
    var n = parseInt(v, 10);
    if(n > 0) saveGoal(n);
  });
  host.appendChild(goalCell);

  requestAnimationFrame(function(){
    var c = document.querySelector("#"+ringId+" .fg");
    if(c) c.setAttribute("stroke-dashoffset", String(113 - 113*pct));
  });
}

function stat(k, v, sub){
  return el("div",{class:"stat"},[
    el("div",{class:"k",text:k}),
    el("div",{class:"v num",text:v}),
    el("div",{class:"sub",text:sub})
  ]);
}

function ringSVG(id, pct){
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns,"svg");
  svg.setAttribute("class","ring"); svg.setAttribute("id",id); svg.setAttribute("viewBox","0 0 44 44");
  var bg = document.createElementNS(ns,"circle");
  bg.setAttribute("class","bg"); bg.setAttribute("cx","22"); bg.setAttribute("cy","22"); bg.setAttribute("r","18");
  var fg = document.createElementNS(ns,"circle");
  fg.setAttribute("class","fg"); fg.setAttribute("cx","22"); fg.setAttribute("cy","22"); fg.setAttribute("r","18");
  fg.setAttribute("stroke-dasharray","113"); fg.setAttribute("stroke-dashoffset","113");
  fg.setAttribute("transform","rotate(-90 22 22)");
  svg.appendChild(bg); svg.appendChild(fg);
  return svg;
}

          count: state.books.filter(function(b){ return b.genre===g.id; }).length};
      })));

  host.appendChild(facetGroup("Status", "status",
    STATUSES.filter(function(s){ return state.books.some(function(b){ return b.status===s.id; }); })
      .map(function(s){
        return {val:s.id, label:s.name,
          count: state.books.filter(function(b){ return b.status===s.id; }).length};
      })));

  host.appendChild(facetGroup("Shortcuts", "flag", [
    {val:"needs",   label:"Needs checking", color:"var(--warn)",
      count: state.books.filter(isFlagged).length},
    {val:"fav",     label:"Favourites", count: state.books.filter(function(b){ return b.favorite; }).length},
    {val:"series",  label:"In a series", count: state.books.filter(function(b){ return b.series; }).length},
    {val:"lent",    label:"Lent out",   count: state.books.filter(function(b){ return b.lentTo; }).length},
    {val:"unrated", label:"Unrated",    count: state.books.filter(function(b){ return !b.rating; }).length}
  ].filter(function(o){ return o.count > 0; })));

  var langs = facet("l", function(b){ return b.language; });
  if(Object.keys(langs).length > 1){
    host.appendChild(facetGroup("Language","language", Object.keys(langs).sort().map(function(k){
      return {val:k, label:k, count:langs[k]};
    })));
  }

  var shelves = facet("s", function(b){ return b.shelf; });
  if(Object.keys(shelves).length){
    host.appendChild(facetGroup("Where it lives","shelf", Object.keys(shelves).sort().map(function(k){
      return {val:k, label:k, count:shelves[k]};
    })));
  }

  var fmts = facet("f", function(b){ return b.format; });
  if(Object.keys(fmts).length > 1){
    host.appendChild(facetGroup("Format","format", Object.keys(fmts).sort().map(function(k){
      return {val:k, label:k, count:fmts[k]};
    })));
  }

  var tags = facet("t", function(b){ return b.tags; });
  var tagKeys = Object.keys(tags).filter(function(t){ return t !== "verify"; })
    .sort(function(a,b){ return tags[b]-tags[a] || a.localeCompare(b); });
  if(tagKeys.length){
    host.appendChild(facetGroup("Tags","tag", tagKeys.slice(0,26).map(function(k){
      return {val:k, label:k, count:tags[k]};
    })));
  }

  host.appendChild(facetGroup("Rating","stars", [5,4,3,2,1]
    .filter(function(n){ return state.books.some(function(b){ return b.rating===n; }); })
    .map(function(n){
      return {val:String(n), label:"★".repeat(n),
        count: state.books.filter(function(b){ return b.rating===n; }).length};
    })));

  if(activeFilterCount()){
    host.appendChild(el("button",{class:"btn btn-sm",style:"align-self:flex-start",
      text:"Clear all filters", onclick:function(){
        Object.keys(state.filters).forEach(function(k){ state.filters[k] = []; });
        render();
      }}));
  }
}

function facetGroup(title, key, items){
  if(!items.length) return el("div",{style:"display:none"});
  var box = el("div",{class:"fgroup"},[ el("h3",{text:title}) ]);
  var chips = el("div",{class:"chips"});
  items.forEach(function(it){
    var on = state.filters[key].indexOf(it.val) >= 0;
    var kids = [];
    if(it.color) kids.push(el("span",{class:"dot",style:"background:"+it.color}));
    kids.push(el("span",{text:it.label}));
    kids.push(el("span",{class:"ct",text:String(it.count)}));
    chips.appendChild(el("button",{class:"chip","aria-pressed":on?"true":"false",onclick:function(){
      var arr = state.filters[key], i = arr.indexOf(it.val);
      if(i >= 0) arr.splice(i,1); else arr.push(it.val);
      render();
    }}, kids));
  });
  box.appendChild(chips);
  return box;
}

/* ---------------- results toolbar ---------------- */

function renderResbar(){
  var host = document.getElementById("resbar");
  clear(host);
  var list = visibleBooks();
  var total = state.books.length;

  host.appendChild(el("div",{class:"count",html:
    "<b>" + list.length + "</b> of " + total + " shown"}));

  var af = el("div",{class:"activefilters"});
  Object.keys(state.filters).forEach(function(key){
    state.filters[key].forEach(function(val){
      var label = val;
      if(key === "genre") label = (GMAP[val]||{}).name || val;
      if(key === "status") label = (SMAP[val]||{}).name || val;
      if(key === "stars") label = "★".repeat(Number(val));
      if(key === "flag") label = {needs:"Needs checking",fav:"Favourites",lent:"Lent out",unrated:"Unrated",series:"In a series"}[val] || val;
      af.appendChild(el("span",{class:"afil"},[
        el("span",{text:label}),
        el("button",{"aria-label":"Remove filter "+label,text:"×",onclick:function(){
          var arr = state.filters[key]; arr.splice(arr.indexOf(val),1); render();
        }})
      ]));
    });
  });
  if(state.q.trim()){
    af.appendChild(el("span",{class:"afil"},[
      el("span",{text:"“"+state.q.trim()+"”"}),
      el("button",{"aria-label":"Clear search",text:"×",onclick:function(){
        state.q=""; document.getElementById("q").value=""; render();
      }})
    ]));
  }
  host.appendChild(af);
  host.appendChild(el("div",{class:"spacer"}));

  if(state.view !== "insights"){
    var sel = el("select",{"aria-label":"Sort by",onchange:function(e){ state.sort = e.target.value; renderStage(); }});
    [["added-desc","Recently added"],["title-asc","Title A–Z"],["author-asc","Author A–Z"],
     ["series-asc","Series order"],["rating-desc","Highest rated"],["pages-desc","Longest first"],
     ["pages-asc","Shortest first"],["year-desc","Newest edition"],["prog-desc","Furthest along"]]
      .forEach(function(o){
        sel.appendChild(el("option",{value:o[0],text:o[1],selected:state.sort===o[0]?true:null}));
      });
    host.appendChild(el("div",{class:"sortsel"},[
      el("span",{class:"count",text:"Sort"}), sel
    ]));
  }
}

/* ============================================================
   7. Render — views
   ============================================================ */

function renderStage(){
  var host = document.getElementById("stage");
  clear(host);
  if(!state.loaded){ return; }

  if(!state.books.length){ host.appendChild(emptyLibrary()); return; }

  if(state.view === "insights"){ host.appendChild(insightsView()); return; }

  var list = visibleBooks();
  if(!list.length){ host.appendChild(emptyResults()); return; }

  if(state.view === "shelf")  host.appendChild(shelfView(list));
  if(state.view === "stacks") host.appendChild(stacksView(list));
  if(state.view === "table")  host.appendChild(tableView(list));
}

function emptyLibrary(){
  return el("div",{class:"empty"},[
    el("h3",{text:"The shelves are empty"}),
    el("p",{text:"Add a book by hand, or paste a CSV export from Goodreads, StoryGraph or a spreadsheet and fill the whole shelf at once."}),
    el("div",{style:"display:flex;gap:10px;justify-content:center;flex-wrap:wrap"},[
      el("button",{class:"btn btn-primary",text:"Add the first book",onclick:function(){ openForm(null); }}),
      el("button",{class:"btn",text:"Import CSV",onclick:openImport}),
      el("button",{class:"btn",text:"Restore the original 117",onclick:function(){
        resetToOriginal(); toast("Original catalogue restored.");
      }})
    ])
  ]);
}

function emptyResults(){
  return el("div",{class:"empty"},[
    el("h3",{text:"Nothing matches that"}),
    el("p",{text:"Loosen a filter or clear the search to see the rest of the collection."}),
    el("button",{class:"btn",text:"Clear search and filters",onclick:function(){
      state.q=""; document.getElementById("q").value="";
      Object.keys(state.filters).forEach(function(k){ state.filters[k]=[]; });
      render();
    }})
  ]);
}

/* ---------------- shelf ---------------- */

function shelfView(list){
  var grid = el("div",{class:"grid"});
  list.forEach(function(b, i){
    grid.appendChild(bookCard(b, i));
  });
  return grid;
}

/* The drawn cover is always built; a real jacket fades in on top of it when
   the image loads, so a missing file just leaves the drawn one showing. */
function makeCover(b, titleSize){
  var inner = el("div",{class:"cover-in"},[
    el("div",{class:"cover-rule"}),
    el("div",{class:"cover-t",style: titleSize ? "font-size:"+titleSize : null, text:b.title}),
    el("div",{},[
      b.series ? el("div",{class:"cover-series",text:b.series + (b.seriesNo ? " · " + b.seriesNo : "")}) : null,
      el("div",{class:"cover-a",text:b.author || "Unknown author"})
    ])
  ]);

  var cover = el("div",{class:"cover",style:"--g:"+bookColor(b)},[ inner ]);

  if(b.cover){
    var img = el("img",{class:"cover-img",src:COVER_DIR + b.cover + ".jpg",
      alt:"Cover of " + b.title, loading:"lazy", decoding:"async"});
    img.addEventListener("load", function(){ cover.classList.add("has-img"); });
    img.addEventListener("error", function(){
      cover.classList.remove("has-img");
      if(img.parentNode) img.parentNode.removeChild(img);
    });
    cover.appendChild(img);
  }
  return cover;
}

function bookCard(b, i){
  var prog = progressOf(b);
  var selected = !!state.selection[b.id];

  var badges = el("div",{class:"cover-badges"});
  if(b.favorite) badges.appendChild(el("span",{class:"bdg fav",text:"♥"}));
  if(b.status === "reading") badges.appendChild(el("span",{class:"bdg",text:"Reading"}));
  else if(b.status === "read") badges.appendChild(el("span",{class:"bdg",text:"Read"}));
  else if(b.status === "paused") badges.appendChild(el("span",{class:"bdg",text:"Paused"}));
  if(b.lentTo) badges.appendChild(el("span",{class:"bdg",text:"Lent"}));
  if(isFlagged(b)) badges.appendChild(el("span",{class:"bdg warn",title:"Read off a blurry spine",text:"Check"}));

  var cover = makeCover(b);
  cover.appendChild(badges);
  if(prog > 0 && prog < 1){
    cover.appendChild(el("div",{class:"cover-prog"},[ el("i",{style:"width:"+(prog*100)+"%"}) ]));
  }

  var selBtn = el("button",{class:"sel-box","aria-pressed":selected?"true":"false",
    "aria-label":"Select "+b.title, text: selected ? "✓" : "",
    onclick:function(ev){
      ev.stopPropagation();
      if(state.selection[b.id]) delete state.selection[b.id]; else state.selection[b.id] = true;
      render();
    }});
  cover.appendChild(selBtn);

  var card = el("button",{class:"card"+(selected?" selected":""),
    style:"animation-delay:" + Math.min(i*22, 460) + "ms",
    onclick:function(){ openDetail(b.id, cover); }},[
    cover,
    el("div",{class:"meta"},[
      el("div",{class:"t",text:b.title}),
      el("div",{class:"a",text:b.author || "—"}),
      el("div",{class:"r"},[
        starsEl(b.rating),
        el("span",{text: b.pages ? b.pages + " pp" : ((GMAP[b.genre]||{}).name || "")})
      ])
    ])
  ]);
  return card;
}

function starsEl(n){
  var s = el("span",{class:"stars"});
  for(var i=1;i<=5;i++){
    s.appendChild(el("span",{class: i<=n ? "" : "off", text:"★"}));
  }
  return s;
}

/* ---------------- spines ---------------- */

function stacksView(list){
  var wrap = el("div",{class:"stacks"});
  var perRow = 0;
  var rows = [];
  var cur = [];
  // Rows sized by cumulative spine width so shelves look packed, not padded.
  var budget = 0;
  var stageEl = document.getElementById("stage");
  var maxBudget = Math.max(240, (stageEl ? stageEl.clientWidth : 900) - 30);
  list.forEach(function(b){
    var w = spineWidth(b);
    if(budget + w > maxBudget && cur.length){ rows.push(cur); cur = []; budget = 0; }
    cur.push(b); budget += w + 2;
  });
  if(cur.length) rows.push(cur);

  rows.forEach(function(row, ri){
    var shelfEl = el("div",{class:"shelfrow"});
    var books = el("div",{class:"shelfbooks"});
    row.forEach(function(b, bi){
      books.appendChild(spineEl(b, ri*8 + bi));
    });
    shelfEl.appendChild(books);
    wrap.appendChild(shelfEl);
    wrap.appendChild(el("div",{class:"board"}));
  });
  perRow = rows.length;
  wrap.appendChild(el("p",{class:"hint",style:"margin:4px 0 0",
    text: list.length + " spines across " + perRow + " shelf" + (perRow===1?"":"ves") + " — width follows page count, colour follows genre. Click a spine to open it."}));
  return wrap;
}

function spineWidth(b){
  var p = b.pages || 300;
  return Math.max(20, Math.min(56, Math.round(p / 12)));
}

function spineEl(b, i){
  var w = spineWidth(b);
  var h = 120 + (((b.title || "").length * 7 + (b.pages||0)) % 46);
  var label = el("span",{class:"spine-txt"});
  label.appendChild(document.createTextNode(b.title));
  if(b.author) label.appendChild(el("small",{text:"   " + b.author}));

  var s = el("button",{class:"spine"+(state.selection[b.id]?" selected":""),
    style:"--g:"+bookColor(b)+";width:"+w+"px;height:"+h+"px;animation-delay:"+Math.min(i*18,420)+"ms",
    title:b.title + (b.author ? " — " + b.author : ""),
    onclick:function(){ openDetail(b.id, s); }},[ label ]);
  return s;
}

/* ---------------- catalogue table ---------------- */

function tableView(list){
  var cols = [
    {k:"title", label:"Title"},
    {k:"author", label:"Author"},
    {k:"series", label:"Series"},
    {k:"genre", label:"Genre"},
    {k:"status", label:"Status"},
    {k:"rating", label:"Rating"},
    {k:"pages", label:"Pages"},
    {k:"year", label:"Year"},
    {k:"shelf", label:"Shelf"}
  ];
  var thead = el("thead");
  var tr = el("tr");
  cols.forEach(function(c){
    var isSort = state.sort.indexOf(c.k + "-") === 0;
    var dir = isSort && state.sort.slice(-4) === "desc" ? "▼" : "▲";
    tr.appendChild(el("th",{onclick:function(){
      var asc = c.k + "-asc", desc = c.k + "-desc";
      state.sort = state.sort === asc ? desc : asc;
      render();
    }},[
      el("span",{text:c.label}),
      isSort ? el("span",{class:"arrow",text:" " + dir}) : null
    ]));
  });
  thead.appendChild(tr);

  var tbody = el("tbody");
  list.forEach(function(b){
    var row = el("tr",{style:"cursor:pointer",onclick:function(){ openDetail(b.id); }});
    row.appendChild(el("td",{},[ el("div",{class:"tt"},[
      el("span",{class:"swatch",style:"--g:"+bookColor(b)}),
      el("span",{text:b.title}),
      b.favorite ? el("span",{style:"color:var(--gold)",text:"♥"}) : null
    ]) ]));
    row.appendChild(el("td",{text:b.author || "—"}));
    row.appendChild(el("td",{text: b.series ? b.series + (b.seriesNo ? " #" + b.seriesNo : "") : "—"}));
    row.appendChild(el("td",{},[ el("span",{class:"pill",
      style:"color:"+bookColor(b), text:(GMAP[b.genre]||{}).name}) ]));
    row.appendChild(el("td",{},[ el("span",{class:"pill "+b.status,text:(SMAP[b.status]||{}).name}) ]));
    row.appendChild(el("td",{},[ starsEl(b.rating) ]));
    row.appendChild(el("td",{class:"num",text: b.pages || "—"}));
    row.appendChild(el("td",{class:"num",text: b.year || "—"}));
    row.appendChild(el("td",{text: b.shelf || "—"}));
    tbody.appendChild(row);
  });

  return el("div",{class:"tablewrap"},[ el("table",{},[ thead, tbody ]) ]);
}

/* ============================================================
   8. Insights
   ============================================================ */

function insightsView(){
  var wrap = el("div",{class:"panels"});
  var bs = state.books;

  /* -- genre donut -- */
  var gCounts = GENRES.map(function(g){
    return {id:g.id, name:g.name, color:"var("+g.v+")", n: bs.filter(function(b){ return b.genre===g.id; }).length};
  }).filter(function(g){ return g.n > 0; }).sort(function(a,b){ return b.n-a.n; });

  wrap.appendChild(panel("What the collection is made of",
    "Every book counted once, by its genre.",
    [ donutPanel(gCounts, bs.length) ]));

  /* -- status bars -- */
  var stCounts = STATUSES.map(function(s){
    return {name:s.name, n: bs.filter(function(b){ return b.status===s.id; }).length, color:"var(--accent)"};
  }).filter(function(s){ return s.n>0; });
  wrap.appendChild(panel("Where each book stands",
    "Reading status across the whole shelf.",
    [ barsPanel(stCounts, bs.length) ]));

  /* -- ratings histogram -- */
  var rCounts = [5,4,3,2,1].map(function(n){
    return {name:"★".repeat(n), n: bs.filter(function(b){ return b.rating===n; }).length, color:"var(--gold)"};
  });
  var rated = bs.filter(function(b){ return b.rating>0; }).length;
  wrap.appendChild(panel("How you rated them",
    rated + " of " + bs.length + " books have a rating.",
    [ barsPanel(rCounts, Math.max(1, Math.max.apply(null, rCounts.map(function(r){return r.n;})))) ]));

  /* -- top authors -- */
  var aCount = {};
  bs.forEach(function(b){ if(b.author) aCount[b.author] = (aCount[b.author]||0)+1; });
  var top = Object.keys(aCount).map(function(k){ return {name:k, n:aCount[k]}; })
    .sort(function(a,b){ return b.n-a.n || a.name.localeCompare(b.name); }).slice(0,10);
  var maxA = top.length ? top[0].n : 1;
  wrap.appendChild(panel("Most-collected authors",
    Object.keys(aCount).length + " authors on the shelves.",
    [ barsPanel(top.map(function(t){ return {name:t.name, n:t.n, color:"var(--accent)"}; }), maxA, true) ]));

  /* -- finished per month -- */
  var months = [];
  var now = new Date();
  for(var i=11;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    var key = d.toISOString().slice(0,7);
    months.push({key:key, label:d.toLocaleDateString(undefined,{month:"short"}),
      full:d.toLocaleDateString(undefined,{month:"long",year:"numeric"}),
      n: bs.filter(function(b){ return (b.dateFinished||"").slice(0,7)===key; }).length});
  }
  var anyFinished = months.some(function(m){ return m.n>0; });
  wrap.appendChild(panel("Books finished, month by month",
    anyFinished ? "The last twelve months." : "Add a finish date to a book and it will appear here.",
    [ colsPanel(months) ], true));

  /* -- longest / shelf spread -- */
  var shelves = facet("s", function(b){ return b.shelf; });
  var shelfKeys = Object.keys(shelves).sort();
  if(shelfKeys.length){
    var maxS = Math.max.apply(null, shelfKeys.map(function(k){ return shelves[k]; }));
    wrap.appendChild(panel("How full each shelf is",
      shelfKeys.length + " physical locations recorded.",
      [ barsPanel(shelfKeys.map(function(k){ return {name:k, n:shelves[k], color:"var(--c3)"}; }), maxS, true) ]));
  }

  return wrap;
}

function panel(title, sub, kids, wide){
  return el("div",{class:"panel"+(wide?" wide":"")},[
    el("h3",{text:title}),
    el("p",{class:"ph",text:sub})
  ].concat(kids));
}

function donutPanel(items, total){
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns,"svg");
  svg.setAttribute("class","donut");
  svg.setAttribute("viewBox","0 0 120 120");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Genre breakdown");

  var cx=60, cy=60, rO=54, rI=33, a0=-Math.PI/2;
  items.forEach(function(it){
    var frac = it.n/total;
    var sweep = frac * Math.PI * 2;
    // 2px surface gap between segments
    var gap = items.length > 1 ? 0.028 : 0;
    var a1 = a0 + Math.max(sweep - gap, sweep*0.35);
    var p = document.createElementNS(ns,"path");
    p.setAttribute("d", arcPath(cx,cy,rO,rI,a0,a1));
    p.setAttribute("fill", it.color);
    p.addEventListener("mousemove", function(e){
      showTip(e, it.name + " · <b>" + it.n + "</b> (" + Math.round(frac*100) + "%)");
    });
    p.addEventListener("mouseleave", hideTip);
    p.addEventListener("click", function(){
      state.filters.genre = [it.id]; state.view = "shelf"; syncTabs(); render();
    });
    svg.appendChild(p);
    a0 += sweep;
  });

  var t1 = document.createElementNS(ns,"text");
  t1.setAttribute("x","60"); t1.setAttribute("y","57"); t1.setAttribute("text-anchor","middle");
  t1.setAttribute("fill","var(--ink)"); t1.setAttribute("font-size","22");
  t1.setAttribute("font-family","JetBrains Mono, monospace"); t1.setAttribute("font-weight","700");
  t1.textContent = String(total);
  var t2 = document.createElementNS(ns,"text");
  t2.setAttribute("x","60"); t2.setAttribute("y","72"); t2.setAttribute("text-anchor","middle");
  t2.setAttribute("fill","var(--ink-3)"); t2.setAttribute("font-size","9.5");
  t2.setAttribute("font-family","JetBrains Mono, monospace"); t2.setAttribute("letter-spacing","1.4");
  t2.textContent = "BOOKS";
  svg.appendChild(t1); svg.appendChild(t2);

  var legend = el("div",{class:"legend"});
  items.forEach(function(it){
    legend.appendChild(el("button",{class:"lg",onclick:function(){
      state.filters.genre = [it.id]; state.view = "shelf"; syncTabs(); render();
    }},[
      el("span",{class:"sw",style:"background:"+it.color}),
      el("span",{class:"nm",text:it.name}),
      el("span",{class:"vl",text:it.n})
    ]));
  });

  return el("div",{class:"donutwrap"},[ svg, legend ]);
}

function arcPath(cx,cy,rO,rI,a0,a1){
  var large = (a1-a0) > Math.PI ? 1 : 0;
  var x0=cx+rO*Math.cos(a0), y0=cy+rO*Math.sin(a0);
  var x1=cx+rO*Math.cos(a1), y1=cy+rO*Math.sin(a1);
  var x2=cx+rI*Math.cos(a1), y2=cy+rI*Math.sin(a1);
  var x3=cx+rI*Math.cos(a0), y3=cy+rI*Math.sin(a0);
  return "M"+x0+" "+y0+"A"+rO+" "+rO+" 0 "+large+" 1 "+x1+" "+y1+
         "L"+x2+" "+y2+"A"+rI+" "+rI+" 0 "+large+" 0 "+x3+" "+y3+"Z";
}

function barsPanel(items, max, showNames){
  var box = el("div",{class:"bars"});
  items.forEach(function(it, i){
    var track = el("div",{class:"bt"});
    var fill = el("div",{class:"bf",style:"--g:"+(it.color||"var(--accent)")});
    track.appendChild(fill);
    box.appendChild(el("div",{class:"bar"},[
      el("span",{class:"bl",text:it.name,title:showNames?it.name:null}),
      track,
      el("span",{class:"bv",text:String(it.n)})
    ]));
    requestAnimationFrame(function(){
      setTimeout(function(){ fill.style.width = (max ? (it.n/max*100) : 0) + "%"; }, 40 + i*45);
    });
  });
  return box;
}

function colsPanel(months){
  var max = Math.max(1, Math.max.apply(null, months.map(function(m){ return m.n; })));
  var box = el("div",{class:"cols"});
  months.forEach(function(m, i){
    var bar = el("div",{class:"cb"});
    var col = el("div",{class:"col"},[
      el("span",{class:"cv",text: m.n ? String(m.n) : ""}),
      bar,
      el("span",{class:"cl",text:m.label})
    ]);
    col.addEventListener("mousemove", function(e){
      showTip(e, m.full + " · <b>" + m.n + "</b> finished");
    });
    col.addEventListener("mouseleave", hideTip);
    box.appendChild(col);
    requestAnimationFrame(function(){
      setTimeout(function(){ bar.style.height = (m.n/max*100) + "%"; }, 60 + i*40);
    });
  });
  return box;
}

/* ============================================================
   9. Detail sheet
   ============================================================ */

function reduceMotion(){
  return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

/* The element the book flew out of, so it can fly back into it on close. */
var flightOrigin = null;
var closing = false;

function closeModal(){
  var host = document.getElementById("modalHost");
  var scrim = host.firstChild;
  var sheet = scrim && scrim.querySelector(".sheet");
  var cover = sheet && sheet.querySelector(".dt-cover");

  function finish(){
    clear(host);
    document.body.style.overflow = "";
    if(flightOrigin){ flightOrigin.style.visibility = ""; flightOrigin = null; }
    closing = false;
  }

  if(closing) return;

  // send the book back to the shelf it came from
  if(cover && flightOrigin && document.body.contains(flightOrigin) && !reduceMotion()){
    closing = true;
    var flew = flyCover(flightOrigin, cover, "out", 420, "cubic-bezier(.4,0,.2,1)", finish);
    if(flew){
      sheet.animate([{opacity:1},{opacity:0}], {duration:240, easing:"ease-in", fill:"forwards"});
      scrim.animate([{opacity:1},{opacity:0}], {duration:400, easing:"ease-in", fill:"forwards"});
      // the shelf slot fills back in just as the book lands
      window.setTimeout(function(){
        if(flightOrigin) flightOrigin.style.visibility = "";
      }, 340);
      return;
    }
    closing = false;
  }
  finish();
}

/* Where `target` would have to start to sit exactly on top of `origin`. */
function flightDelta(origin, target){
  var from = origin.getBoundingClientRect();
  var to = target.getBoundingClientRect();
  if(!from.width || !to.width) return null;
  var sx = from.width / to.width;
  var sy = from.height / to.height;
  var dx = (from.left + from.width / 2) - (to.left + to.width / 2);
  var dy = (from.top + from.height / 2) - (to.top + to.height / 2);
  return { transform: "translate(" + dx + "px," + dy + "px) scale(" + sx + "," + sy + ")", to: to };
}

/* The sheet scrolls, so a cover travelling in from the grid would be clipped
   by it. Fly a fixed-position copy over the whole page instead, and swap it
   for the real one once it lands. */
function flyCover(origin, target, dir, ms, easing, done){
  var d = flightDelta(origin, target);
  if(!d){ if(done) done(); return false; }

  var clone = target.cloneNode(true);
  clone.setAttribute("aria-hidden", "true");
  clone.style.cssText += ";position:fixed;margin:0;pointer-events:none;z-index:150;" +
    "left:" + d.to.left + "px;top:" + d.to.top + "px;" +
    "width:" + d.to.width + "px;height:" + d.to.height + "px;";
  document.body.appendChild(clone);
  target.style.opacity = "0";

  var frames = dir === "in"
    ? [{ transform: d.transform }, { transform: "none" }]
    : [{ transform: "none" }, { transform: d.transform }];

  var anim = clone.animate(frames, { duration: ms, easing: easing, fill: "forwards" });
  anim.addEventListener("finish", function(){
    if(clone.parentNode) clone.parentNode.removeChild(clone);
    target.style.opacity = "";
    if(done) done();
  });
  return true;
}

function openModal(node, opts){
  opts = opts || {};
  var host = document.getElementById("modalHost");
  clear(host);
  closing = false;

  var scrim = el("div",{class:"scrim",onclick:function(e){ if(e.target === scrim) closeModal(); }});
  var sheet = el("div",{class:"sheet"+(opts.narrow?" narrow":""),role:"dialog","aria-modal":"true"});
  sheet.appendChild(el("button",{class:"sheet-x",text:"×","aria-label":"Close",onclick:closeModal}));
  sheet.appendChild(node);
  scrim.appendChild(sheet);
  host.appendChild(scrim);
  document.body.style.overflow = "hidden";

  var cover = sheet.querySelector(".dt-cover");
  var origin = opts.origin;

  if(opts.instant){
    sheet.classList.add("sheet-static");
  } else if(cover && origin && document.body.contains(origin) && !reduceMotion()){
    sheet.classList.add("sheet-flight");
    // the book leaves the shelf, so the slot it came from goes empty
    origin.style.visibility = "hidden";
    flightOrigin = origin;

    var flew = flyCover(origin, cover, "in", 560, "cubic-bezier(.22,1,.3,1)");
    if(flew){
      // the panel arrives a beat later, so the book leads the movement
      scrim.animate([{opacity:0},{opacity:1}], {duration:280, easing:"ease-out"});
      var panel = sheet.querySelector(".dt-panel");
      if(panel){
        panel.animate(
          [{opacity:0, transform:"translateY(16px)"}, {opacity:1, transform:"none"}],
          {duration:480, delay:120, easing:"cubic-bezier(.16,1,.3,1)", fill:"backwards"});
      }
      var tail = sheet.querySelector(".dt-sec");
      if(tail){
        tail.animate(
          [{opacity:0, transform:"translateY(18px)"}, {opacity:1, transform:"none"}],
          {duration:480, delay:220, easing:"cubic-bezier(.16,1,.3,1)", fill:"backwards"});
      }
      staggerIn(sheet);
    } else {
      sheet.classList.remove("sheet-flight");
      sheet.classList.add("sheet-in");
      origin.style.visibility = "";
      flightOrigin = null;
    }
  } else {
    sheet.classList.add("sheet-in");
  }

  var f = sheet.querySelector("input,select,textarea,button:not(.sheet-x)");
  if(f && opts.focus) f.focus();
}

/* Details settle in one after another rather than all at once. */
function staggerIn(sheet){
  var items = sheet.querySelectorAll("[data-stagger]");
  Array.prototype.forEach.call(items, function(n, i){
    n.animate([{opacity:0, transform:"translateY(10px)"}, {opacity:1, transform:"none"}],
      {duration:420, delay:200 + i * 55, easing:"cubic-bezier(.16,1,.3,1)", fill:"backwards"});
  });
}

function isFlagged(b){ return (b.tags || []).indexOf("verify") >= 0; }

function clearFlag(b){
  b.tags = (b.tags || []).filter(function(t){ return t !== "verify"; });
  saveBook(b);
}

function reopen(id){ openDetail(id, null, true); }

function openDetail(id, origin, instant){

  /* status select */

  /* progress */

    });
    rng.addEventListener("change", function(){
      b.currentPage = Number(rng.value);

    });

  }

  var facts = el("div",{class:"dt-facts","data-stagger":true});
  [["Genre",(GMAP[b.genre]||{}).name],

  (b.tags||[]).filter(function(t){ return t !== "verify"; }).forEach(function(t){
    tagRow.appendChild(el("button",{class:"chip",text:t,onclick:function(){
      closeModal(); state.filters.tag = [t]; render();
    }}));
  });

  /* Titles I read off a blurry spine say so, and can be settled in one click. */
  var flagNote = null;
  if(isFlagged(b)){
    flagNote = el("div",{class:"flagnote","data-stagger":true},[

    ])
  ]);

  openModal(body, {origin: origin, instant: instant});
}

function selectedBooks(){

function renderBulk(){
  var existing = document.getElementById("bulkbar");

  if(!sel.length) return;

  var bar = el("div",{class:"bulkbar",id:"bulkbar"},[

  var setSel = el("select",{"aria-label":"Set status",style:"width:auto;padding:5px 8px;font-size:13px"});

  setSel.addEventListener("change", function(){
    if(!setSel.value) return;
    sel.forEach(function(b){
      b.status = setSel.value;
      if(b.status==="read" && !b.dateFinished) b.dateFinished = todayISO();
      saveBook(b);
    });
    toast(sel.length + " books updated.");

  bar.appendChild(setSel);

  bar.appendChild(el("button",{class:"btn btn-sm",text:"Add tag",onclick:function(){

    });
    toast("Tagged “" + t + "”.");
  }}));

  bar.appendChild(el("button",{class:"btn btn-sm",text:"Favourite",onclick:function(){
    sel.forEach(function(b){ b.favorite = true; saveBook(b); });
    toast(sel.length + " marked as favourites.");
  }}));

  bar.appendChild(el("button",{class:"btn btn-sm btn-danger",text:"Remove",onclick:function(){
    var copies = sel.map(function(b){ return Object.assign({}, b); });
    copies.forEach(function(b){ removeBook(b.id); });

    render();
    toast("Removed " + copies.length + " books.", "Undo", function(){
      copies.forEach(function(b){ saveBook(normalize(b)); });

  }}));

  bar.appendChild(el("button",{class:"btn btn-sm btn-ghost",text:"Clear",onclick:function(){

      el("kbd",{text:"/"}),        el("span",{text:"Jump to search"}),
      el("kbd",{text:"n"}),        el("span",{text:"Add a book"}),
      el("kbd",{text:"r"}),        el("span",{text:"Pick something to read"}),
      el("kbd",{text:"1 – 4"}),    el("span",{text:"Switch view"}),
      el("kbd",{text:"t"}),        el("span",{text:"Toggle light / dark"}),
      el("kbd",{text:"Esc"}),      el("span",{text:"Close, or clear the search"})
    ]),
    el("p",{class:"hint",style:"margin-top:16px",
      text:"Your changes are saved in this browser only — they do not follow you to another device or another browser. Export a CSV backup now and then, and import it on the other machine."})
  ]);
  openModal(body,{narrow:true});
}

function toolCard(title, sub, action, fn){
  return el("div",{style:"border:1px solid var(--line);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:6px"},[
    el("div",{style:"font-weight:700",text:title}),
    el("div",{class:"hint",style:"flex:1",text:sub}),
    el("button",{class:"btn btn-sm",style:"align-self:flex-start",text:action,onclick:fn})
  ]);
}

function openImport(){
  var ta = el("textarea",{style:"min-height:180px;font-family:var(--f-mono);font-size:12.5px",
    placeholder:"title,author,genre,status,rating,pages,year,tags\nJamaica Inn,Daphne du Maurier,other,read,4,302,1936,classic"});
  var out = el("p",{class:"hint"});
  var body = el("div",{class:"form"},[
    el("h2",{text:"Import from CSV"}),
    el("p",{class:"hint",style:"margin:0",
      text:"First row is the header. Recognised columns: title, author, series, seriesNo, genre, status, rating, pages, currentPage, format, language, year, publisher, isbn, shelf, tags, notes, quote, dateFinished, favorite. Anything missing is fine."}),
    ta, out,
    el("div",{class:"form-actions"},[
      el("div",{class:"spacer"}),
      el("button",{class:"btn",text:"Cancel",onclick:closeModal}),
      el("button",{class:"btn btn-primary",text:"Import",onclick:function(){
        var rows = parseCSV(ta.value);
        if(rows.length < 2){ out.textContent = "Need a header row and at least one book."; return; }
        var head = rows[0].map(function(h){ return h.trim(); });
        var added = 0;
        rows.slice(1).forEach(function(r){
          if(!r.length || r.every(function(c){ return !c.trim(); })) return;
          var o = {};
          head.forEach(function(h,i){ o[h] = r[i] !== undefined ? r[i].trim() : ""; });
          if(!o.title) return;
          if(o.genre && !GMAP[o.genre]){
            var g = GENRES.find(function(x){ return x.name.toLowerCase() === String(o.genre).toLowerCase(); });
            o.genre = g ? g.id : "other";
          }
          if(o.favorite) o.favorite = /^(1|true|yes|y)$/i.test(o.favorite);
          o.id = uid();
          saveBook(normalize(o));
          added++;
        });
        closeModal();
        toast(added + " book" + (added===1?"":"s") + " imported.");
      }})
    ])
  ]);
  openModal(body,{narrow:true});
}

function parseCSV(text){
  var rows = [], row = [], cell = "", q = false, i = 0;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  while(i < text.length){
    var c = text[i];
    if(q){
      if(c === '"'){
        if(text[i+1] === '"'){ cell += '"'; i++; } else { q = false; }
      } else cell += c;
    } else {
      if(c === '"') q = true;
      else if(c === ","){ row.push(cell); cell = ""; }
      else if(c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += c;
    }
    i++;
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

function toCSV(){
  var cols = ["title","author","series","seriesNo","genre","status","rating","pages","currentPage",
    "format","language","year","publisher","isbn","shelf","tags","favorite","lentTo","quote","notes",
    "dateAdded","dateFinished","color","cover"];
  var lines = [cols.join(",")];
  state.books.forEach(function(b){
    lines.push(cols.map(function(c){
      var v = b[c];
      if(Array.isArray(v)) v = v.join("; ");
      if(v === undefined || v === null) v = "";
      v = String(v);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
    }).join(","));
  });
  return lines.join("\n");
}

function exportFile(kind){
  var name = "spine-index-" + todayISO() + "." + kind;
  var data = kind === "csv" ? toCSV() : JSON.stringify(state.books, null, 2);
  if(window.claude && window.claude.use){
    window.claude.use("downloads").then(function(d){
      if(!d){ showTextFallback(name, data); return; }
      d.save({filename:name, data:data}).then(function(){
        toast("Saved " + name + ".");
      }).catch(function(){ showTextFallback(name, data); });
    }).catch(function(){ showTextFallback(name, data); });
  } else showTextFallback(name, data);
}

function showTextFallback(name, data){
  var ta = el("textarea",{style:"min-height:280px;font-family:var(--f-mono);font-size:12px"});
  ta.value = data;
  openModal(el("div",{class:"form"},[
    el("h2",{text:"Copy your " + name.split(".").pop().toUpperCase()}),
    el("p",{class:"hint",style:"margin:0",text:"Select everything below and copy it into a file called " + name + "."}),
    ta,
    el("div",{class:"form-actions"},[
      el("div",{class:"spacer"}),
      el("button",{class:"btn btn-primary",text:"Select all",onclick:function(){ ta.focus(); ta.select(); }}),
      el("button",{class:"btn",text:"Close",onclick:closeModal})
    ])
  ]),{narrow:true});
}

function findDuplicates(){
  var seen = {}, dupes = [];
  state.books.forEach(function(b){
    var k = (b.title+"|"+b.author).toLowerCase().replace(/\s+/g," ").trim();
    if(seen[k]) dupes.push(b); else seen[k] = b;
  });
  if(!dupes.length){ closeModal(); toast("No duplicates — the catalogue is clean."); return; }
  var list = el("div",{style:"display:flex;flex-direction:column;gap:8px"});
  dupes.forEach(function(b){
    list.appendChild(el("div",{style:"display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-m);padding:9px 12px"},[
      el("span",{class:"swatch",style:"--g:"+bookColor(b)}),
      el("div",{style:"flex:1;min-width:0"},[
        el("div",{style:"font-weight:600",text:b.title}),
        el("div",{class:"hint",text:b.author || "—"})
      ]),
      el("button",{class:"btn btn-sm btn-danger",text:"Remove",onclick:function(ev){
        removeBook(b.id);
        ev.target.closest("div").parentNode.removeChild(ev.target.closest("div"));
        toast("Removed one copy.");
      }})
    ]));
  });
  openModal(el("div",{class:"form"},[
    el("h2",{text: dupes.length + " possible duplicate" + (dupes.length===1?"":"s")}),
    el("p",{class:"hint",style:"margin:0",text:"Same title and author, catalogued more than once."}),
    list,
    el("div",{class:"form-actions"},[
      el("div",{class:"spacer"}),
      el("button",{class:"btn",text:"Done",onclick:closeModal})
    ])
  ]),{narrow:true});
}

/* ============================================================
   13. Delight
   ============================================================ */

function celebrate(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cv = document.getElementById("confetti");
  cv.hidden = false;
  var ctx = cv.getContext("2d");
  var w = cv.width = window.innerWidth, h = cv.height = window.innerHeight;
  var cols = ["#5B2BD6","#B8770A","#00897B","#DB4B2A","#1F52C4","#6E8C0E","#B01E6A","#0E86B8"];
  var bits = [];
  for(var i=0;i<90;i++){
    bits.push({
      x: w/2 + (Math.random()-.5)*260,
      y: h*0.42 + (Math.random()-.5)*60,
      vx:(Math.random()-.5)*9,
      vy:-(Math.random()*11+5),
      w: 5 + Math.random()*7, hh: 8 + Math.random()*12,
      r: Math.random()*Math.PI, vr:(Math.random()-.5)*.28,
      c: cols[(Math.random()*cols.length)|0]
    });
  }
  var t0 = performance.now();
  (function frame(now){
    var dt = Math.min(34, now - t0); t0 = now;
    ctx.clearRect(0,0,w,h);
    var alive = false;
    bits.forEach(function(p){
      p.vy += 0.42; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= 0.995;
      if(p.y < h + 40) alive = true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.hh/2,p.w,p.hh);
      ctx.restore();
    });
    if(alive) requestAnimationFrame(frame);
    else { ctx.clearRect(0,0,w,h); cv.hidden = true; }
  })(t0);
}

function surpriseMe(){
  var pool = state.books.filter(function(b){ return b.status === "toread"; });
  if(!pool.length) pool = state.books.filter(function(b){ return b.status !== "read"; });
  if(!pool.length) pool = state.books;
  if(!pool.length){ toast("Add a book first."); return; }
  var pick = pool[(Math.random()*pool.length)|0];
  openDetail(pick.id);
  toast("Try this one next.");
}

/* ============================================================
   14. Theme + wiring
   ============================================================ */

function initTheme(){
  var saved = null;
  try{ saved = localStorage.getItem("spineindex.theme"); }catch(e){}
  if(saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
}
function toggleTheme(){
  var cur = document.documentElement.getAttribute("data-theme");
  var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  var next = cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("spineindex.theme", next); }catch(e){}
}

/* The rail is always there on a wide screen and a drawer on a narrow one.
   A hidden rail stops being a grid item, so the layout drops to one column
   with it — otherwise the books would sit in the rail's narrow track. */
function syncRail(){
  var rail = document.getElementById("rail");
  var layout = document.querySelector(".layout");
  if(!rail || !layout) return;
  var narrow = window.matchMedia("(max-width:980px)").matches;
  var show = narrow ? state.railOpen : true;
  rail.hidden = !show;
  layout.classList.toggle("no-rail", !show);
}

function syncTabs(){
  ["shelf","stacks","table","insights"].forEach(function(v){
    var btn = document.getElementById("v-"+v);
    if(btn) btn.setAttribute("aria-selected", state.view===v ? "true" : "false");
  });
}

function setView(v){
  state.view = v;
  syncTabs();
  try{ localStorage.setItem("spineindex.view", v); }catch(e){}
  renderResbar(); renderStage();
}

function wire(){
  document.querySelectorAll(".views button").forEach(function(btn){
    btn.addEventListener("click", function(){ setView(btn.dataset.view); });
  });

  var qEl = document.getElementById("q");
  var qt;
  qEl.addEventListener("input", function(){
    clearTimeout(qt);
    qt = setTimeout(function(){ state.q = qEl.value; renderResbar(); renderStage(); }, 110);
  });

  document.getElementById("ded").addEventListener("click", editDedication);
  renderDedication();

  document.getElementById("addBtn").addEventListener("click", function(){ openForm(null); });
  document.getElementById("diceBtn").addEventListener("click", surpriseMe);
  document.getElementById("moreBtn").addEventListener("click", openTools);
  document.getElementById("themeBtn").addEventListener("click", toggleTheme);
  document.getElementById("railBtn").addEventListener("click", function(){
    state.railOpen = !state.railOpen;
    syncRail();
  });
  syncRail();

  // shelves are packed to the container width, so repack when it changes
  var rt;
  window.addEventListener("resize", function(){
    syncRail();
    clearTimeout(rt);
    rt = setTimeout(function(){ if(state.view === "stacks") renderStage(); }, 160);
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(document.querySelector(".scrim")){ closeModal(); return; }
      if(qEl.value){ qEl.value = ""; state.q = ""; render(); }
      return;
    }
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === "/"){ e.preventDefault(); qEl.focus(); qEl.select(); }
    else if(e.key === "n"){ e.preventDefault(); openForm(null); }
    else if(e.key === "r"){ e.preventDefault(); surpriseMe(); }
    else if(e.key === "t"){ toggleTheme(); }
    else if(e.key === "1"){ setView("shelf"); }
    else if(e.key === "2"){ setView("stacks"); }
    else if(e.key === "3"){ setView("table"); }
    else if(e.key === "4"){ setView("insights"); }
  });

  try{
    var v = localStorage.getItem("spineindex.view");
    if(v && ["shelf","stacks","table","insights"].indexOf(v) >= 0){ state.view = v; syncTabs(); }
  }catch(e){}
}

initTheme();
wire();
bootStorage();

})();
